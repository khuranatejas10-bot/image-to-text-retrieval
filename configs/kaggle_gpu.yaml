project_name: PageOCRDiff
seed: 42
device: cuda
data_root: data/kaggle
output_dir: runs/kaggle_gpu
num_workers: 2
mixed_precision: true

detector:
  backbone: resnet18
  pretrained_backbone: true
  output_stride: 2
  num_orientation_bins: 32
  num_scale_bins: 10
  scale_bin_edges: [0, 8, 12, 18, 26, 36, 48, 62, 78, 96, 1.0e6]
  lambda_scale: 0.1
  lambda_orientation: 0.3
  lr: 2.0e-4
  lr_decay_factor: 0.8
  lr_decay_every: 1000
  max_iterations: 3000
  batch_size: 8
  image_size: 512
  region_threshold: 0.30
  affinity_threshold: 0.25
  min_component_area: 4
  min_component_score: 0.20
  delaunay_epsilon: 2.0
  max_poly_degree: 4
  line_deviation_scale_factor: 0.25

recognizer:
  backbone: resnet_small
  use_bilstm: true
  bilstm_hidden: 256
  img_height: 32
  img_width: 128
  charset: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~ "
  blank_index: 0
  lr: 5.0e-4
  batch_size: 64
  max_iterations: 10000
  grad_clip: 5.0

diffusion_sr:
  T: 100
  lr_pretrain: 2.0e-4
  lr_finetune: 1.0e-4
  hr_height: 32
  hr_width: 128
  lr_height: 16
  lr_width: 64
  base_channels: 32
  num_res_blocks: 4
  time_emb_dim: 64
  fe_channels: 32
  fe_num_blocks: 3
  ddim_steps: 10
  use_ddim: true
  recon_weight: 1.0
  enhancement_confidence_threshold: 0.15
  max_iterations: 3000
  batch_size: 32
